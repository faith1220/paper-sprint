[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-sprint"
version = "0.1.0"
description = "Local, source-grounded protocols for practical combination research"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
paper-sprint = "paper_composer.cli:main"
paper-composer = "paper_composer.cli:main"

[tool.setuptools.packages.find]
include = ["paper_composer*"]
